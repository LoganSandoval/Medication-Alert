<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medication Reminder</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Medication Reminder</h1>
        <p class="subtitle">Add your medications below. You will get an alarm every day at the time you set.</p>

        <div class="card">
            <h2>Add a Medication</h2>
            <label for="med-name">Medication name</label>
            <input type="text" id="med-name" placeholder="e.g. Vitamin D">

            <label for="med-time">Time to take it</label>
            <input type="time" id="med-time">

            <button onclick="addReminder()">Add Reminder</button>
            <p id="status"></p>
        </div>

        <div class="card">
            <h2>Your Medications</h2>
            <div id="med-list"></div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
